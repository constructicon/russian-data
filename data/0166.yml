name: 'какой, к чёрту, NP!'
UD_name: 'какой, к чёрту, NP!'
illustration: 'Какой, к чёрту, сон! Мне нужно работать!'
cefr_level: C1
definitions:
  - russian: |
       Конструкция используется в качестве ответа на вопрос собеседника. Говорящий не согласен с адресатом и сомневается в предложенном [варианте чего-либо]Theme. Конструкция характерна для разговорной речи и невысокого стиля, не употребляется в вежливом общении. На письме конструкция может сопровождаться как восклицательным знаком, так и вопросительным.
  - norwegian: |
       Konstruksjonen anvendes som et svar på et spørsmål fra samtalepartneren. Taleren er uenig med adressaten og betviler den foreslåtte [versjonen av noe]Theme. Konstruksjonen er typisk for talespråket, har lavt stilnivå og brukes ikke i høflig kommunikasjon. I skrift kan konstruksjonen ledsages av så vel utropstegn som spørsmålstegn.
examples:
  - |
       ― У нас с тобой сегодня по плану шопинг! ― Какой, к чёрту, [шопинг]Theme, у меня голова болит, и вообще я устала.
  - |
       ― Ну, подожди, сейчас перестройка. Может, уладится как-нибудь, все изменится. ― Какая, к чёрту, [перестройка]Theme? Что может измениться?
  - |
       Район называется Центральный. Тут метро есть, можно на нем доехать. ― Какое, к чёрту, [метро]Theme, я на машине.
  - |
       ― Трамвая жду! Дойдя до конца коридора, Мюллер подумал: «Какого, к черту, [трамвая]Theme!» и оглянулся. Штирлица уже не было.
  - |
       ― Нет, она ведьма, ― возражает Дианка, ― она моей бабушке говорила ― к ней духи ходят. ― Какие, к чёрту, [духи]Theme!? ― спрашиваю я.

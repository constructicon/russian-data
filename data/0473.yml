name: 'NP-Dat Cop далеко до NP-Gen'
UD_name: 'NP-Dat Cop далеко до NP-Gen'
illustration: 'Тебе далеко до лучшего работника.'
cefr_level: A2
definitions:
  - russian: |
       Конструкция обозначает, что [участник ситуации]Participant или [объект]Theme не обладает достаточными качествами и недостаточно хорош, чтобы быть как [эталон]Standard. Конструкция основана на сравнении и содержит оценочную характеристику возможностей или качеств [участника]Participant или [объекта]Theme как значительно уступающих возможностям или качествам [того эталона, с которым они сравниваются]Standard. Как если бы говорящий считал, что расстояние от участника или объекта до эталона очень велико.
  - norwegian: |
       Konstruksjonen betyr at [en deltaker i situasjonen]Participant eller [et objekt]Theme ikke besitter de nødvendige kvaliteter og ikke kan måle seg med [standardeksemplaret]Standard. Konstruksjonen er basert på sammenligning og inneholder en vurdering av [deltakerens]Participant eller [objektets]Theme muligheter eller kvaliteter som vesentlig dårligere enn mulighetene eller kvalitetene til [det standardeksemplaret de sammenliknes med]Standard. Det er som om taleren mener avstanden fra deltakeren eller objektet til standardeksemplaret er svært stor.
examples:
  - |
       Видите ли, дело в том, что [губернатору области]Participant ещё далеко до [президента]Standard.
  - |
       Что бы фашисты ни делали с народами, как бы они ни были жестоки, [им]Participant далеко до [большевиков]Standard.
  - |
       Не говорю уж о Пушкине, в подлинном воздействии на умы [ему]Participant далеко до [Толстого]Standard или [Достоевского]Standard.
  - |
       [Этому проекту]Theme явно было далеко до [звания “лучшей в мире компании”.]Standard
  - |
       Это тоже весьма динамичный автомобиль, но по разгону [ему]Theme далеко до [RS 6]Standard: и тяжелее лимузин, и моторы у него послабее, а стоит почти столько же.

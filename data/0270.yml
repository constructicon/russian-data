name: 'по-Adj/Adv-Cmp'
UD_name: 'по-Adj/Adv-Cmp'
illustration: 'К сыну надо относиться помягче.'
cefr_level: A2
definitions:
  - russian: |
       Конструкция понижает степень интенсивности [признака]Property на некоторое не очень большое значение (помягче = 'немного мягче'). Этот признак выражается сравнительной степенью прилагательного или наречия.
  - norwegian: |
       Konstruksjonen senker et [kjennetegns]Property intensitet til et ikke særlig høyt nivå (помягче = 'немного мягче'). Kjennetegnet uttrykkes ved hjelp av den komparative formen av et adjektiv eller et adverb.
examples:
  - |
       Он уже начинал чувствовать приближение ночи, и ему хотелось, чтобы кто-нибудь [посильнее]Property включил лампу.
  - |
       Другую найдем на ваше рабочее место. [Помоложе]Property и [поумнее]Property.
  - |
       Он искал работу [поближе]Property к дому.
  - |
       ― Ой, Паш, у нас репетиция, позвони [попозже]Property!
  - |
       Серёжа хотел купить для меня огромную фиговую пальму, но оказалось, что в квартиру она не вместится, и поэтому он купил мне пальмочку [поменьше]Property.

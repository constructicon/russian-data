record: 415
name: 'Cl с тех пор, как Cl'
UD_name: 'Cl с тех пор, как Cl'
illustration: 'Он мне не звонил с тех пор, как переехал в Москву.'
cefr_level: B1
definitions:
  - russian: |
       Конструкция обозначает длительную [ситуацию]Situation, точкой отсчета которой стало некоторое [событие]Event. Позиция зависимой клаузы [«с тех пор, как Cl»]Event в предложении нефиксированная: она может стоять перед, после или в середине [главной клаузы]Situation.
  - english: |
       старый перевод This construction expresses that [something]Situation has, or has not, happened since the time of [a particular event]Time. As illustrated in the examples below, the two parts of the construction, here marked as Situation and Time, may appear in either order.
  - norwegian: |
       Konstruksjonen betegner en langvarig [situasjon]Situation som en gitt [hendelse]Event er blitt startpunktet for. Leddsetningens ["с тех пор, как Cl"]Event plass i setningen er ikke fast: Den kan stå før, etter eller inni [hovedsetningen]Situation.
examples:
  - |
       Я тут теперь посчитал, ― выходит, что [семнадцать лет прошло]Situation с тех пор, как [он мне это сказал]Event.
  - |
       [Она, наверно, не вставала]Situation с тех пор, как [я ушёл]Event.
  - |
       С тех пор, как [они встретились]Event, [у Марины появилась соперница]Situation.
  - |
       С тех пор как [я на пенсии]Event, [я собираю все редкие книги]Situation.
  - |
       Артур с тех пор, как [поступил в институт]Event, [в родном городе больше не появлялся]Situation.

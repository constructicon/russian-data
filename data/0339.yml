definitions:
  - russian: |
       Конструкция обозначает, что некоторый [участник]Possessor обладает [объектом]Theme, [свойством]Property или находится в отношениях с некоторым [участником]Participant. [Объекты]Theme обладания могут быть как конкретными (пример 1), так и абстрактными (пример 3).
  - norwegian: |
       Konstruksjonen betyr at en gitt [deltaker]Possessor besitter [et objekt]Theme eller [en egenskap]Property eller står i forbindelse med en gitt [deltaker]Participant. [Objektet]Theme som besittes, kan være så vel konkret (eksempel 1) som abstrakt (eksempel 3).
examples:
  - |
       У [Черкасова]Possessor была [дача]Theme, [машина]Theme, [квартира]Theme и [слава]Property.
  - |
       Разве плохо, что у [людей]Possessor есть [выбор]Theme, где и как им жить?
  - |
       Многие из них хотели бы создать свой бизнес ― у [ребят]Possessor есть [идеи]Theme, [энергия]Theme, [навыки]Theme.
  - |
       Может быть, у [сериала]Possessor есть [недостатки]Property, но у любой картины есть не самые удачные штрихи.
  - |
       У [мамы]Possessor есть [подруга]Participant, которая живёт в центре.
